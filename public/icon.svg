<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Terminal Card -->
  <g filter="url(#shadow)">
    <rect x="56" y="86" width="400" height="340" rx="36" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="6" stroke-opacity="0.4" />
    
    <!-- Window Header -->
    <rect x="56" y="86" width="400" height="56" rx="36" fill="#0f172a" />
    <circle cx="96" cy="114" r="8" fill="#f43f5e" />
    <circle cx="124" cy="114" r="8" fill="#fbbf24" />
    <circle cx="152" cy="114" r="8" fill="#10b981" />
    <text x="256" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">INFOGISA LAB</text>
  </g>

  <!-- Code / Terminal Icons -->
  <!-- Left Angle Bracket < -->
  <path d="M 180 210 L 120 260 L 180 310" stroke="url(#codeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Right Angle Bracket > -->
  <path d="M 332 210 L 392 260 L 332 310" stroke="url(#codeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Center Slash / or SQL Terminal Symbol -->
  <path d="M 276 195 L 236 325" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- Badge / Star at bottom center -->
  <g transform="translate(256, 372)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#4f46e5" stroke="#818cf8" stroke-width="3" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">실기 트레이너</text>
  </g>
</svg>
